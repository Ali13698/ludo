<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>منچ آنجل</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="menu">
  <div class="brand"><span class="brand-icon">🧚</span><h1>منچ آنجل</h1></div>
  <div class="card">
    <div class="row">
      <div class="row-label">تعداد بازیکن</div>
      <div class="opts" id="optPlayers">
        <button type="button" data-v="2" class="on">۲ نفره</button>
        <button type="button" data-v="3">۳ نفره</button>
        <button type="button" data-v="4">۴ نفره</button>
      </div>
    </div>
  </div>
  <button type="button" id="playBtn">✨ شروع بازی</button>
</div>

<div id="game">
  <div class="profiles" id="profiles"></div>
  <div id="boardArea"><canvas id="board"></canvas></div>
  <div class="bottom">
    <div class="timerBar"><div class="timerFill" id="timerFill" style="width:100%"></div></div>
    <div class="controls">
      <div id="diceBox">🎲</div>
      <button type="button" id="rollBtn">ROLL</button>
    </div>
    <div id="statusText">آماده</div>
  </div>
</div>

<div id="err"></div>
<script src="game.js"></script>
</body>
</html>
