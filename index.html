<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>منچ آنجل</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;font-family:'Vazirmatn',system-ui,sans-serif;background:#05060c;color:#fff;}
body{
  background:
    radial-gradient(circle at 20% 0%, #1a2456 0%, transparent 50%),
    radial-gradient(circle at 80% 100%, #3d1e5e 0%, transparent 50%),
    radial-gradient(circle at 50% 50%, #0b1024 0%, #05060c 100%);
  position:fixed;inset:0;
}
body::before{
  content:'';position:fixed;inset:0;
  background-image:
    radial-gradient(1.5px 1.5px at 15% 20%, #fff 50%, transparent),
    radial-gradient(1px 1px at 45% 60%, #fff 50%, transparent),
    radial-gradient(1.5px 1.5px at 75% 30%, #fff 50%, transparent),
    radial-gradient(1px 1px at 90% 80%, #fff 50%, transparent),
    radial-gradient(1.5px 1.5px at 30% 85%, #fff 50%, transparent),
    radial-gradient(1px 1px at 60% 15%, #fff 50%, transparent);
  background-size:200px 200px;opacity:.5;pointer-events:none;
  animation:twinkle 8s ease-in-out infinite;
}
@keyframes twinkle{0%,100%{opacity:.35;}50%{opacity:.75;}}

/* ---------- Angel 3D ---------- */
.angel-3d{
  width:150px;height:150px;margin:0 auto 8px;position:relative;
  filter:drop-shadow(0 20px 40px rgba(251,191,36,.5));
  animation:angelFloat 3.5s ease-in-out infinite;
}
@keyframes angelFloat{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-10px) rotate(2deg);}}
.angel-3d::after{
  content:'';position:absolute;inset:-20px;
  background:radial-gradient(circle,rgba(251,191,36,.35) 0%,transparent 60%);
  animation:glowPulse 2.5s ease-in-out infinite;pointer-events:none;z-index:-1;
}
@keyframes glowPulse{0%,100%{opacity:.6;transform:scale(1);}50%{opacity:1;transform:scale(1.15);}}

/* ---------- Dice 3D ---------- */
.dice-3d{
  width:44px;height:44px;display:inline-block;vertical-align:middle;
  margin-left:10px;
  animation:spin3d 4s linear infinite;
  transform-style:preserve-3d;
  filter:drop-shadow(0 6px 16px rgba(0,0,0,.5));
}
@keyframes spin3d{
  0%{transform:rotateY(0deg) rotateX(-15deg);}
  100%{transform:rotateY(360deg) rotateX(-15deg);}
}

/* ---------- Settings Screen ---------- */
#settings{position:fixed;inset:0;display:flex;flex-direction:column;padding:24px 20px;overflow-y:auto;z-index:5;}
#settings.off{display:none;}
.brand{text-align:center;margin-bottom:8px;}
.brand-title{
  font-size:30px;font-weight:900;letter-spacing:.5px;
  background:linear-gradient(135deg,#fbbf24 0%,#f59e0b 50%,#fbbf24 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 16px rgba(251,191,36,.5));
}
.brand-sub{font-size:13px;color:#94a3b8;margin-top:2px;font-weight:500;}

.card{
  background:linear-gradient(180deg,rgba(30,41,59,.78),rgba(15,23,42,.88));
  border:1px solid rgba(255,255,255,.08);
  border-radius:22px;padding:6px;
  box-shadow:0 8px 32px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.03) inset;
  margin-top:18px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
.row{display:flex;justify-content:space-between;align-items:center;padding:15px 14px;flex-wrap:wrap;gap:10px;}
.row+.row{border-top:1px solid rgba(255,255,255,.06);}
.row-label{font-size:13.5px;font-weight:600;color:#e2e8f0;}
.opts{display:flex;gap:5px;flex-wrap:wrap;background:rgba(0,0,0,.3);padding:4px;border-radius:12px;}
.opts button{
  background:transparent;border:none;color:#64748b;
  font-size:12px;font-family:inherit;padding:8px 11px;cursor:pointer;
  font-weight:700;border-radius:9px;transition:all .2s;
}
.opts button.on{
  background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;
  box-shadow:0 4px 12px rgba(99,102,241,.5);
}

#playBtn{
  margin-top:20px;padding:18px;border:none;border-radius:18px;
  background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#ec4899 100%);
  color:#fff;font-family:inherit;font-size:17px;font-weight:800;cursor:pointer;
  box-shadow:0 12px 32px rgba(139,92,246,.5),0 0 0 1px rgba(255,255,255,.15) inset;
  transition:transform .15s;letter-spacing:.5px;
  position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
#playBtn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);
  transform:translateX(-100%);
  animation:shine 3s infinite;
}
@keyframes shine{100%{transform:translateX(100%);}}
#playBtn:active{transform:scale(.97);}

/* ---------- Game Screen ---------- */
#game{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:8px;z-index:4;}
#game.on{display:flex;}
#board{
  display:block;border-radius:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.1) inset;
}
#status{
  margin-top:12px;font-size:14.5px;font-weight:700;padding:12px 20px;
  background:linear-gradient(180deg,rgba(30,41,59,.9),rgba(15,23,42,.9));
  border:1px solid rgba(255,255,255,.1);border-radius:16px;
  text-align:center;min-width:240px;
  box-shadow:0 8px 24px rgba(0,0,0,.4);
}
#diceBtn{
  padding:16px 36px;font-size:17px;font-weight:800;border:none;border-radius:16px;
  background:linear-gradient(135deg,#f59e0b 0%,#f97316 100%);
  color:#fff;font-family:inherit;cursor:pointer;margin-top:10px;
  box-shadow:0 12px 32px rgba(249,115,22,.5),0 0 0 1px rgba(255,255,255,.2) inset;
  transition:transform .15s;letter-spacing:.5px;min-width:170px;
  display:flex;align-items:center;justify-content:center;
}
#diceBtn:active:not(:disabled){transform:scale(.95);}
#diceBtn:disabled{opacity:.35;filter:grayscale(.5);}
.icon-btn{
  position:fixed;top:14px;padding:10px 14px;
  background:rgba(30,41,59,.8);color:#fff;
  border:1px solid rgba(255,255,255,.1);border-radius:12px;
  font-family:inherit;cursor:pointer;z-index:10;
  backdrop-filter:blur(10px);font-size:14px;font-weight:700;
  box-shadow:0 4px 16px rgba(0,0,0,.4);
}
#backBtn{right:14px;}
#muteBtn{left:14px;}

/* ---------- Room UI ---------- */
#roomUI{
  position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#1a2456 0%,#05060c 70%);
  z-index:100;display:none;flex-direction:column;padding:24px;align-items:center;justify-content:center;gap:18px;
}
#roomUI.on{display:flex;}
#roomUI .panel{
  background:linear-gradient(180deg,rgba(30,41,59,.85),rgba(15,23,42,.95));
  border:1px solid rgba(255,255,255,.08);border-radius:24px;
  padding:28px 22px;width:100%;max-width:340px;
  display:flex;flex-direction:column;align-items:center;gap:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.03) inset;
  backdrop-filter:blur(20px);
}
#roomUI .panel h2{font-size:18px;font-weight:800;color:#e2e8f0;margin-bottom:4px;}
#roomUI input{
  padding:16px;font-size:22px;text-align:center;
  background:rgba(0,0,0,.4);color:#fff;
  border:2px solid rgba(139,92,246,.4);border-radius:14px;
  font-family:inherit;width:100%;letter-spacing:8px;font-weight:800;
  outline:none;transition:border .2s;
}
#roomUI input:focus{border-color:#8b5cf6;box-shadow:0 0 0 4px rgba(139,92,246,.2);}
#roomUI button{
  padding:16px 20px;font-size:15px;font-weight:800;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  color:#fff;border:none;border-radius:14px;font-family:inherit;cursor:pointer;
  width:100%;box-shadow:0 8px 24px rgba(99,102,241,.4);transition:transform .15s;
}
#roomUI button:active{transform:scale(.97);}
#roomUI button.alt{background:rgba(30,41,59,.9);border:1px solid rgba(255,255,255,.1);box-shadow:0 4px 16px rgba(0,0,0,.3);}
#roomUI .code-box{
  font-size:36px;font-weight:900;letter-spacing:10px;
  background:linear-gradient(135deg,#fbbf24,#f59e0b);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  padding:18px 24px;border:2px dashed rgba(251,191,36,.4);border-radius:16px;
  width:100%;text-align:center;
  filter:drop-shadow(0 4px 20px rgba(251,191,36,.3));
}
#roomUI .hint{opacity:.7;font-size:13px;text-align:center;color:#94a3b8;line-height:1.6;}
#roomUI .spinner{
  width:40px;height:40px;border:3px solid rgba(139,92,246,.2);
  border-top-color:#8b5cf6;border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

#err{
  position:fixed;bottom:0;left:0;right:0;background:linear-gradient(180deg,#991b1b,#7f1d1d);
  color:#fff;padding:10px;font-size:11px;font-family:monospace;
  display:none;z-index:999;direction:ltr;text-align:left;
  max-height:30vh;overflow:auto;white-space:pre-wrap;
  border-top:2px solid #ef4444;
}
</style>

var audioCtx=null,muted=false;
function getAudio(){
  if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  return audioCtx;
}
function beep(freq,dur,type,vol,delay){
  if(muted)return;
  try{
    var a=getAudio();if(!a)return;
    var o=a.createOscillator(),g=a.createGain();
    o.type=type||'sine';o.frequency.value=freq;
    o.connect(g);g.connect(a.destination);
    var t=a.currentTime+(delay||0);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol||0.15,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.001,t+(dur||0.1));
    o.start(t);o.stop(t+(dur||0.1)+0.02);
  }catch(e){}
}

  }
}

function gridOf(pl,pos,idx){
  if(pos===0)return [P[pl].base[idx][0],P[pl].base[idx][1]];
  if(pos<=51){var a=(P[pl].start+pos-1)%52;return [path[a][0]+0.5,path[a][1]+0.5];}
  if(pos<=56){var h=P[pl].home[pos-52];return [h[0]+0.5,h[1]+0.5];}
  return [7.5,7.5];
}
