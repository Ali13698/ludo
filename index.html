<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>آنجل - بازی منچ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="stars"></div>
<div id="stars2"></div>

<div id="menu">
  <div class="brand">
    <span class="brand-icon">🧚</span>
    <h1>آنجل</h1>
  </div>
  <div class="card">
    <div class="row">
      <div class="row-label">حالت بازی</div>
      <div class="opts" data-k="players">
        <button type="button" data-v="1v1" class="on">۲ نفره</button>
        <button type="button" data-v="2v2">۲ به ۲</button>
        <button type="button" data-v="3">۳ نفره</button>
        <button type="button" data-v="4">۴ نفره</button>
      </div>
    </div>
    <div class="row">
      <div class="row-label">خونه‌های امن</div>
      <div class="opts" data-k="safe">
        <button type="button" data-v="off">خاموش</button>
        <button type="button" data-v="on" class="on">روشن</button>
      </div>
    </div>
    <div class="row">
      <div class="row-label">مهره‌های هدف</div>
      <div class="opts" data-k="goals">
        <button type="button" data-v="2" class="on">۲</button>
        <button type="button" data-v="4">۴</button>
      </div>
    </div>
    <div class="row">
      <div class="row-label">خروج در نوبت اول</div>
      <div class="opts" data-k="firstExit">
        <button type="button" data-v="off" class="on">خاموش</button>
        <button type="button" data-v="on">روشن</button>
      </div>
    </div>
  </div>
  <button type="button" id="playBtn"><span>🎲</span><span>شروع بازی</span></button>
</div>

<div id="lobby" class="screen-hidden">
  <div class="lobby-header">
    <div class="lobby-user">
      <div class="avatar" id="lobbyAvatar">🙂</div>
      <div class="lobby-user-info">
        <div class="lobby-user-name" id="lobbyName">...</div>
        <div class="lobby-user-stats" id="lobbyStats">🏆 0 | 💰 0</div>
      </div>
    </div>
    <button type="button" id="backToMenu" class="icon-btn" style="position:static;">←</button>
  </div>

  <div class="lobby-grid">
    <button type="button" class="lobby-card big" id="quickMatchBtn">
      <div class="lobby-icon">⚡</div>
      <div class="lobby-title">بازی سریع</div>
      <div class="lobby-sub">با یه حریف تصادفی</div>
    </button>

    <button type="button" class="lobby-card" id="createRoomBtn">
      <div class="lobby-icon">🏠</div>
      <div class="lobby-title">اتاق خصوصی</div>
      <div class="lobby-sub">با کد ۵ حرفی</div>
    </button>

    <button type="button" class="lobby-card" id="joinRoomBtn2">
      <div class="lobby-icon">🔗</div>
      <div class="lobby-title">ورود با کد</div>
      <div class="lobby-sub">کد دوستت رو بزن</div>
    </button>

    <button type="button" class="lobby-card" id="friendsBtn">
      <div class="lobby-icon">👥</div>
      <div class="lobby-title">دوستان</div>
      <div class="lobby-sub" id="friendsBadge">0 آنلاین</div>
    </button>

    <button type="button" class="lobby-card" id="leaderboardBtn">
      <div class="lobby-icon">🏆</div>
      <div class="lobby-title">لیدربورد</div>
      <div class="lobby-sub">بهترین بازیکن‌ها</div>
    </button>

    <button type="button" class="lobby-card" id="profileBtn">
      <div class="lobby-icon">👤</div>
      <div class="lobby-title">پروفایل</div>
      <div class="lobby-sub">تنظیمات شخصی</div>
    </button>
  </div>

  <div class="lobby-status" id="lobbyStatus"></div>
</div>

<div id="game">
  <button type="button" id="gameMenuBtn" class="icon-btn" style="position:fixed;top:14px;left:14px;z-index:20;">⚙️</button>

  <div class="profiles" id="profiles"></div>
  <div id="boardArea"><canvas id="board"></canvas></div>
  <div class="bottom">
    <div class="timerBar"><div class="timerFill" id="timerFill" style="width:100%"></div></div>
    <div class="controls">
      <div id="diceWrap">
        <div class="dice3d" id="dice3d">
          <div class="face front"></div>
          <div class="face back"></div>
          <div class="face right"></div>
          <div class="face left"></div>
          <div class="face top"></div>
          <div class="face bottom"></div>
        </div>
      </div>
      <button type="button" id="rollBtn">ROLL</button>
    </div>
    <div id="statusText">آماده</div>
  </div>
</div>

<div id="modal" class="modal-overlay">
  <div class="modal-box" id="modalBox"></div>
</div>

<div id="err"></div>

<script src="config.js"></script>
<script src="state.js"></script>
<script src="sfx.js"></script>
<script src="dice.js"></script>
<script src="rules.js"></script>
<script src="movement.js"></script>
<script src="bot-opponent.js"></script>
<script src="turn.js"></script>
<script src="bots.js"></script>
<script src="timer.js"></script>
<script src="board.js"></script>
<script src="ui.js"></script>
<script src="online.js"></script>
<script src="chat.js"></script>
<script src="settings.js"></script>
<script src="game.js"></script>
<script src="init.js"></script>
</body>
                        </html>
