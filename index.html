<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تست</title>
</head>
<body style="background:#05060c;color:#fff;padding:20px;font-family:system-ui;">
<h1 id="msg">صفحه لود شد</h1>
<button id="btn" style="padding:20px;font-size:20px;">کلیک کن</button>
<div id="dbg" style="position:fixed;bottom:0;left:0;right:0;background:green;padding:10px;">مرحله ۱</div>
<script>
document.getElementById('dbg').textContent = '✓ JS اجرا شد';
document.getElementById('btn').onclick = function() {
  document.getElementById('msg').textContent = 'کار می‌کنه! ✅';
  document.getElementById('dbg').textContent = '✓ دکمه کار کرد';
  alert('عالیه!');
};
</script>
</body>
</html>
